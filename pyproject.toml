[project]
name = "spin"
version = "0.1.0"
description = "ターミナルで陰影の付いた3Dの図形を回し続けるアニメーション"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# REQ-003 の下限（TEST-20 の例外。DES-003）
fail_under = 90

[tool.ruff]
line-length = 88
# tech.md の「フォーマット対象の拡張子」（.py）に合わせ、Markdown 内のコード例を対象にしない
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.format]
